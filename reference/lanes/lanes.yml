# The convoy routes as reference lines: the ports, and the sea waypoints a route passes to stay at sea. Hand-edited;
# read by tools/build_engagement.py (into records/convoys/convoys.json) for site/convoys.html and site/lanes.html.
# A convoy's `route:` in its convoy.md is a list of these ids, in the order sailed.
#
# Ports are placed on a modern map at the harbour (`source: hand-placed`). No waypoint is traced from a chart yet:
# each says why it is where it is (`assumed`), and the pages draw every leg that touches one dotted. The Japanese
# escort charts name the routes (馬来直航路, the Malay direct route; the Hainan east route) and draw them; tracing
# them would replace these (guides/ENGAGEMENTS.md, "Lanes").
