# The glossary: the records' abbreviations and terms, each explained in a line or two.
# site/glossary.js marks the first use of each term in a passage with a dotted underline; pointing at it or tapping it
# shows the line below, and "see" adds a link to the page that explains more.
#
# Hand-edit freely. Each entry:
#   term   the word as the pages use it (it's also the heading of the card)
#   match  other forms to find, if any (e.g. the plural, an older spelling). Matching ignores case for ordinary words;
#          a form with two capitals in a row (AAA, CP, Med Det) must match exactly, and an abbreviation followed by
#          digits ("VT 0893", "RN 25") is left alone, because that's a grid reference.
#   says   the explanation, in plain words, on the lines below "says: >-" (indented; any punctuation is fine there)
#   see    a kit page that explains more (optional; relative to site/)
#
# Ships aren't listed here: every ship in records/ships.json is linked to its track. Their bare names (without "USS")
# are only matched when they're listed under ships.bare, since Washington, Missouri or Bougainville are also places.

ships:
  bare: [Haynsworth, Essex, Bunker Hill, Hancock, Cabot, Bennington, Belleau Wood, San Jacinto, Intrepid, Wilkes-Barre]

terms:
  # ── Army units and their records ─────────────────────────────────────────────────────────────────────
  - term: morning report
    match: [morning reports]
    says: >-
      A company's or battery's daily report of its strength and of every change (men joining, leaving, sick, wounded),
      with the unit's location. The Army's day-by-day stations here come from them.
    see: relatives.html
  - term: AA
    says: >-
      Anti-aircraft.
  - term: AAA
    says: >-
      Antiaircraft Artillery. In 1943 the Coast Artillery's anti-aircraft regiments were broken up into separate AAA
      battalions.
  - term: AW
    match: [AW Bn]
    says: >-
      Automatic weapons. An AAA AW battalion fought low-flying aircraft with 40 mm Bofors guns and .50-calibre machine
      guns; a gun battalion had 90 mm guns for high-flying ones.
  - term: SP
    says: >-
      Self-propelled, as in "AAA AW Bn (SP)": the guns were mounted on half-tracks.
  - term: CA
    says: >-
      Coast Artillery. A "CA (AA)" regiment was a Coast Artillery regiment equipped for anti-aircraft defence.
  - term: Bn
    says: >-
      Battalion.
  - term: Btry
    says: >-
      Battery, the artillery's company. A battalion had three to five.
  - term: CP
    says: >-
      Command post, where a unit's headquarters was set up. The morning reports often give its location.
  - term: EM
    says: >-
      Enlisted men (as against officers).
  - term: Med Det
    says: >-
      Medical detachment, a battalion's own doctors, aidmen and ambulance drivers.
  - term: Repl Depot
    match: [replacement depot, replacement depots]
    says: >-
      Replacement depot, where soldiers waited to be sent to a unit that needed men.
  - term: SO
    says: >-
      Special Orders, the numbered orders that moved individual soldiers.
  - term: APO
    says: >-
      Army Post Office number, a unit's mail address that didn't give away where it was.
  - term: AIB
    says: >-
      Armored infantry battalion, the infantry of an armored division, carried in half-tracks.
  - term: Combat Command
    match: [CC A, CC B, CC R, CCA, CCB, CCR]
    says: >-
      An armored division fought as three battle groups, Combat Commands A, B and R (Reserve), each a mix of tanks,
      armored infantry and artillery.
  - term: FA
    says: >-
      Field artillery.
  - term: TD
    says: >-
      Tank destroyer, a self-propelled anti-tank gun, or the battalion that had them.
  - term: grid reference
    match: [grid references]
    says: >-
      A position given as a map square's letter and a number of digits, e.g. V-044572. Which grid it's on has to be
      worked out from the date and the towns.
    see: grids.html
  - term: OSS
    says: >-
      Office of Strategic Services, the wartime intelligence service. Its map division drew the 1942 road maps used on
      the Army map.

  # ── The Navy and its records ─────────────────────────────────────────────────────────────────────────
  - term: war patrol report
    match: [war patrol reports]
    says: >-
      A submarine captain's report of one patrol, written up on return, with a narrative, the positions, every attack
      and the depth charges received.
  - term: war diary
    match: [war diaries]
    says: >-
      A ship's or unit's monthly record of where it was and what it did, sent up the chain of command.
  - term: action report
    match: [action reports]
    says: >-
      A ship's report of one engagement, written soon after it.
  - term: muster roll
    match: [muster rolls]
    says: >-
      The Navy's list of the men aboard a ship or in a shore unit, quarter by quarter, with monthly reports of
      changes.
  - term: TF
    says: >-
      Task force, e.g. TF 58, the fast carriers. It was split into task groups (TG 58.3).
  - term: TG
    says: >-
      Task group, part of a task force, e.g. TG 58.3, a few carriers and their screen of battleships, cruisers and
      destroyers.
  - term: CAP
    says: >-
      Combat air patrol, fighters circling over or ahead of the fleet to meet raids before they reached it.
  - term: CIC
    says: >-
      Combat Information Center, the room where a ship's radar picture was plotted and fighters were directed.
  - term: radar picket
    match: [picket, pickets, picket station]
    says: >-
      A destroyer posted miles out from the carriers to see raids coming on radar and warn the fleet, and so often the
      first ship the attackers met.
  - term: LST
    says: >-
      Landing Ship, Tank, a large beaching ship that carried vehicles, men and stores straight onto a beach.
  - term: GCT
    says: >-
      Greenwich Civil Time, the Navy's name for GMT.
    see: zones.html
  - term: zone time
    match: [zone letter, zone letters]
    says: >-
      Each report kept the time of its own time zone, marked by a letter (K, Z, Item…). Two reports can only be
      compared once both are on one clock.
    see: zones.html
  - term: kana grid
    says: >-
      The Japanese Navy's code for a position, a square about 20 miles across named in kana.
    see: jgrid.html
  - term: ONI
    says: >-
      Office of Naval Intelligence. Its recognition manuals (ONI 54 for US ships) gave the silhouettes drawn here.
    see: silhouettes.html
  - term: Seabees
    match: [Seabee, NCB]
    says: >-
      The Navy's construction battalions (CBs, hence "Seabees"), which built airfields, bases and roads, often under
      fire.

  # ── Aircraft and the air war ─────────────────────────────────────────────────────────────────────────
  - term: AI radar
    says: >-
      Airborne Interception radar, a night fighter's own radar. Ground control brought the fighter near a bomber; the
      AI set found it for the last few miles.
  - term: GCI
    says: >-
      Ground-controlled interception, a ground radar station directing a night fighter onto a raider.
  - term: Beaufighter
    match: [Beaufighters]
    says: >-
      A British twin-engined heavy fighter, flown at night with AI radar.
  - term: MACR
    says: >-
      Missing Air Crew Report, filed for every US Army Air Forces aircraft lost, with the crew's and witnesses'
      statements.
  - term: Suisei
    says: >-
      The Yokosuka D4Y, a Japanese Navy carrier dive bomber, called "Judy" by the Allies.
    see: silhouettes.html
  - term: Judy
    says: >-
      The Allies' code name for the Yokosuka D4Y Suisei dive bomber.
    see: silhouettes.html
  - term: Zeke
    says: >-
      The Allies' code name for the Mitsubishi A6M Zero fighter.
    see: silhouettes.html
  - term: Saiun
    says: >-
      The Nakajima C6N, a fast Japanese Navy reconnaissance plane, called "Myrt" by the Allies.
  - term: Kikusui
    says: >-
      "Floating chrysanthemum": the ten mass kamikaze attacks on the fleet at Okinawa, April to June 1945. Kikusui No.
      1 was 6–7 April.
  - term: JV 44
    says: >-
      Jagdverband 44, the Luftwaffe's Me 262 jet-fighter unit led by Adolf Galland in the war's last weeks.
  - term: Me 262
    says: >-
      The Messerschmitt Me 262, the German twin-jet fighter.
  - term: RAF
    says: >-
      Royal Air Force.
  - term: NARA
    says: >-
      The US National Archives and Records Administration, where most of these records are kept.
