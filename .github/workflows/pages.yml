# Publish the kit to GitHub Pages: the site at /site/, with the records submodule beside it,
# after checking that every citation resolves and every track passes the speed check.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Every citation resolves; inventory matches the folders
        run: uv run tools/check_sources.py
      - name: Every Army station is placed, and army.json is up to date
        run: |
          python3 tools/build_army.py
          git diff --exit-code records/army/army.json
      - name: Every Seabee station checks out, and seabees.json is up to date
        run: |
          uv run tools/build_seabees.py
          git diff --exit-code records/seabees/seabees.json
      - name: Every operation's citations and links check out, and operations.json is up to date
        run: |
          uv run tools/build_operations.py
          git diff --exit-code records/operations/operations.json
      - name: Every engagement and convoy checks out (ids, times, citations, links), and their JSON is up to date
        run: uv run tools/build_engagement.py check
      - name: Every glossary entry cites its source, and glossary.json is up to date
        run: uv run tools/build_glossary.py check
      - name: Every torpedo attack row joins its attack and checks out
        run: uv run tools/check_attacks.py
      - name: The engagement pages' shared computation passes its tests
        run: node site/engage.test.js
      - name: Every track passes the speed check
        run: |
          uv run tools/check_track.py all -q | tee /tmp/tracks.txt
          ! grep -v ": 0 too-fast legs" /tmp/tracks.txt

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Assemble the site (no tools, no git metadata)
        run: |
          mkdir _site
          cp -r site reference records _site/
          rm -rf _site/records/.git
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=site/"><title>WWII research kit</title><a href="site/">WWII research kit</a>\n' > _site/index.html
      - name: Stamp the build (time, and each repository's commit and date) for the page footer
        run: |
          kit_sha=$(git rev-parse HEAD); kit_date=$(git log -1 --format=%cI)
          rec_sha=$(git -C records rev-parse HEAD); rec_date=$(git -C records log -1 --format=%cI)
          printf '{"built":"%s","kit":{"sha":"%s","date":"%s"},"records":{"sha":"%s","date":"%s"}}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$kit_sha" "$kit_date" "$rec_sha" "$rec_date" > _site/site/build.json
          cat _site/site/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
