# Publish the kit to GitHub Pages: the site at /site/, with the records submodule beside it,
# after the checks the pre-push hook runs (.pre-commit-config.yaml): ruff and ty, the lint, every build (check), and every
# page (smoke, in four parts at once; skipped when the push changes documentation alone: tools/pages_changed.sh). Actions
# are pinned to a commit, with the tag it was beside.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    # Whether this push can change what the pages show. A push of documentation alone (the kit's Markdown, the records'
    # READMEs) still runs the checks and deploys, but skips the smoke test; a run by hand always has it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pages: ${{ steps.diff.outputs.pages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: tools/pages_changed.sh "$BEFORE" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/*.py
      - name: The tools' Python (ruff; ty, each tool against its own header and the baseline)
        run: |
          uvx ruff@0.16.10 check
          uv run tools/typecheck.py --baseline ty-baseline.json tools -- --config-file ty.toml --extra-search-path tools
      - name: Lint (references, orphans, file forms, records that disagree, ships inland; lint.toml)
        run: uv run tools/lint.py
      - name: Every build checks out and its JSON is up to date; citations, attacks, tracks; the computation's tests
        run: tools/check_builds.sh

  smoke:
    # Every page loads clean, light and dark, desktop and phone: the views split four ways (smoke.py --shard), each part
    # on its own runner, since one runner takes about ten minutes over them all
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/*.py
      - name: Chromium for the Playwright smoke.py pins, with its system libraries
        run: uv run tools/smoke.py --install --with-deps
      - name: Every page loads clean (part ${{ matrix.shard }} of 4)
        env:
          SHARD: ${{ matrix.shard }}
        run: uv run tools/smoke.py --shard "$SHARD/4"

  deploy:
    # after the checks, and after the smoke test or its skipping (a skipped job would otherwise skip this one too)
    needs: [changes, check, smoke]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.check.result == 'success' &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # to publish the site
      id-token: write   # deploy-pages proves to Pages which workflow is publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Assemble the site (no tools, no git metadata)
        run: |
          mkdir _site
          cp -r site reference records _site/
          rm -rf _site/records/.git
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=site/"><title>WWII research kit</title><a href="site/">WWII research kit</a>\n' > _site/index.html
      - name: Version the pages' scripts, stylesheets and data by commit (a new page never runs on older cached files)
        # Pages lets a browser keep each file 10 minutes, so just after a deploy a page could load with the scripts of
        # the deploy before (a new tab button, an old observer.js that doesn't know it), or with new data beside old
        # (a new subjects.json naming a patrol whose positions an old tracks.geojson doesn't have yet: "0 fixes").
        # Each local .js and .css a page names gets ?v=<commit>; external addresses, anchors and ones that already carry
        # a query are left alone. The data the scripts fetch (records/, reference/, build.json) gets the same through a
        # small script put first in each page's <head>: it wraps fetch (which d3.json and d3.csv call) and adds ?v=<commit>
        # to every request to this site that has no query, .js and .css aside. Local serving (tools/serve.py) sends no-cache
        # and needs none of this.
        run: |
          python3 - "$(git rev-parse --short HEAD)" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          ref = re.compile(r'((?:src|href)=")((?![a-z][a-z0-9+.-]*:|//|#)[^"?#]+\.(?:js|css))(")')
          wrap = ('<script>(() => { const f = window.fetch.bind(window); window.fetch = (u, o) => {'
                  ' if (typeof u === "string" || u instanceof URL) { const a = new URL(u, location.href);'
                  ' if (a.origin === location.origin && !a.search && !/\\.(js|css)$/.test(a.pathname)) {'
                  f' a.search = "v={v}"; u = a.href; }} }} return f(u, o); }}; }})();</script>')
          head = re.compile(r'(<head[^>]*>(?:\s*<meta charset[^>]*>)?)', re.I)
          n = d = 0
          for p in pathlib.Path("_site/site").rglob("*.html"):
              s = p.read_text(encoding="utf-8")
              t, k = ref.subn(lambda m: f"{m[1]}{m[2]}?v={v}{m[3]}", s)
              t, j = head.subn(lambda m: m[1] + wrap, t, count=1)
              if k or j:
                  p.write_text(t, encoding="utf-8"); n += k; d += j
          print(f"{n} script and stylesheet addresses versioned ?v={v}; data fetches versioned on {d} pages")
          PY
      - name: Stamp the build (time, and each repository's commit and date) for the page footer
        run: |
          kit_sha=$(git rev-parse HEAD); kit_date=$(git log -1 --format=%cI)
          rec_sha=$(git -C records rev-parse HEAD); rec_date=$(git -C records log -1 --format=%cI)
          printf '{"built":"%s","kit":{"sha":"%s","date":"%s"},"records":{"sha":"%s","date":"%s"}}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$kit_sha" "$kit_date" "$rec_sha" "$rec_date" > _site/site/build.json
          cat _site/site/build.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
