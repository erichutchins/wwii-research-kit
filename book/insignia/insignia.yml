# Shoulder sleeve insignia for the chain-of-command figures (src/wwiibook/chain.py), keyed by the kit's unit id
# (records/army/units.csv, relations.csv). The images are Wikimedia Commons renderings (500 px), cached under the
# kit's sources/insignia/commons/ (git-ignored, re-downloadable from `source`). The designs are the US Army's;
# each rendering's licence is as Commons gives it, and a CC BY-SA one is credited where the figure is printed.
# `period`: what has been checked about the years the patch was worn. A patch not yet checked is drawn, and listed
# in the figure's notes, until it is.

79th-division:
  name: "79th Infantry Division"
  file: "79th_Infantry_Division_SSI.png"
  aspect: 0.852
  source: "https://commons.wikimedia.org/wiki/File:79th_Infantry_Division_SSI.svg"
  licence: "Public domain"
  period: "not yet checked"
