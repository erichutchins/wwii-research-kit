<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>War patrol tracks</title>
<!-- patrols.html?ship=<ship>&patrol=<n> moved to subject.html?s=<ship>&period=<n>&view=records (guides/OPERATIONS-VIEWER.md, phase 6). Kept at the old address so links from outside still arrive; the query is carried across (a meta refresh
     can't map parameters), so this page's one script only rewrites location. -->
<script>
(() => {
  const q = new URLSearchParams(location.search), to = new URLSearchParams();
  to.set("s", q.get("ship") || "bang");
  if (q.get("patrol")) to.set("period", q.get("patrol"));
  if (q.get("t")) to.set("t", q.get("t"));
  to.set("view", "records");
  q.delete("ship"); q.delete("patrol"); q.delete("t");
  for (const [k, v] of q) if (!to.has(k)) to.set(k, v);   // anything else (a family's &who=) carried across as it is
  location.replace(`subject.html?${to}${location.hash}`);
})();
</script>
</head><body><p>Moved: <a href="subject.html">every subject's own page</a>.</p></body></html>
