<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convoys</title>
<!-- convoys.html?c=<convoy> moved to subject.html?s=<convoy>; the ledger of every convoy is subjects.html's (guides/OPERATIONS-VIEWER.md, phase 6). Kept at the old address so links from outside still arrive; the query is carried across (a meta refresh
     can't map parameters), so this page's one script only rewrites location. -->
<script>
(() => {
  const q = new URLSearchParams(location.search), to = new URLSearchParams();
  if (q.get("c")) to.set("s", q.get("c"));
  q.delete("c");
  if (!to.has("s")) { location.replace("subjects.html#convoys"); return; }
  for (const [k, v] of q) if (!to.has(k)) to.set(k, v);   // anything else (a family's &who=) carried across as it is
  location.replace(`subject.html?${to}${location.hash}`);
})();
</script>
</head><body><p>Moved: <a href="subject.html">every subject's own page</a>.</p></body></html>
